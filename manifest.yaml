display_information:
  name: Claude Code Bot
  description: Code review and Claude Code assistant via Slack
  background_color: "#1a1a1a"
  long_description: >-
    Bot that listens for mentions in Slack and delegates to the Claude Code
    instance running on your local machine. Designed for code reviews,
    debugging, and technical questions that benefit from access to your local
    repo, gh CLI, and configured skills.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: claude-code
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - chat:write.public
      - channels:history
      - groups:history
      - im:history
      - im:read
      - im:write
      - mpim:history
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
